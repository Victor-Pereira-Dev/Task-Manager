<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="/projetos/style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <script src="/projetos/script.js" defer></script>
</head>
<body>
    <div class="header">
        <div class="menu-btn">
            <button id="grid-btn">&#9776;</button>
        </div>
        <div id="meu-grid" class="grid-lateral">
            <div class="topo">
                <div class="menu-btn-fechar">
                    <button id="grid-btn-fechar">&#9776;</button>
                </div>
                <a href="#" class="item" id="board">
                    <span class="material-icons-outlined">check_box</span>
                    <span>Quadros</span>
                </a>
                <a href="#" class="item" id="projects">
                    <span class="material-icons-outlined">folder</span>
                    <span>Projetos</span>
                </a>
            </div>
            <a href="#" class="item" id="sair">
                <span class="material-icons-outlined">login</span>
                <span>Sair</span>
            </a>
        </div>
        <div class="title">
            <h1>Task Manager</h1>
            <h3>Made by Victor Pereira</h3>
        </div>
    </div>
    <div class="content">
        <div class="projetos-header">
            <div class="titulo-secao">
                <h2>Projetos</h2>
                <p>Escolha um projeto para entrar no board</p>
            </div>
            <button id="criarProjeto"><span>Novo Projeto</span></button>
        </div>

        <div class="projetos-grid" id="projetos-grid">

        </div>
    </div>
    <div id="overlay-carregando" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center;">
        <div class="spinner-grande"></div>
    </div>
    <div class="modal-overlay" id="modalOverlayProjeto">
        <div class="modal">
            <div class="modal-header">
                <h3>Novo Projeto</h3>
                <button class="modal-close" id="modalCloseProjeto">&times;</button>
            </div>

            <form id="formProjeto">
                <div class="modal-body">
                    <div class="field">
                        <label for="nomeProjeto">Nome do projeto *</label>
                        <input type="text" id="nomeProjeto" placeholder="Ex: Redesign do App Mobile" required>
                    </div>

                    <div class="field">
                        <label for="descricaoProjeto">Descrição</label>
                        <textarea id="descricaoProjeto" placeholder="Do que se trata esse projeto..."></textarea>
                    </div>

                    <div class="row">
                        <div class="field">
                            <label for="statusProjeto">Status</label>
                            <select id="statusProjeto">
                                <option value="ativo" selected>Ativo</option>
                                <option value="pausado">Pausado</option>
                                <option value="concluido">Concluído</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="btnCancelarProjeto">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Criar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlayEditarProjeto">
        <div class="modal">
            <div class="modal-header">
                <h3>Editar Projeto</h3>
                <button class="modal-close" id="modalCloseEditarProjeto">&times;</button>
            </div>

            <form id="formEditarProjeto">
                <div class="modal-body">
                    <div class="field">
                        <label for="nomeProjeto">Nome do projeto *</label>
                        <input type="text" id="nomeProjetoEditar" placeholder="Ex: Redesign do App Mobile" required>
                    </div>

                    <div class="field">
                        <label for="descricaoProjeto">Descrição</label>
                        <textarea id="descricaoProjetoEditar" placeholder="Do que se trata esse projeto..."></textarea>
                    </div>

                    <div class="row">
                        <div class="field">
                            <label for="statusProjeto">Status</label>
                            <select id="statusProjetoEditar">
                                <option value="ativo" selected>Ativo</option>
                                <option value="pausado">Pausado</option>
                                <option value="concluido">Concluído</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="btnDeletarProjeto">Deletar Projeto</button>
                    <button type="submit" class="btn btn-primary" id="btnSalvarProjeto">Salvar Projeto</button>
                </div>
            </form>
        </div>
    </div>

    <div class="footer">
        <div>© <a href="https://www.linkedin.com/in/victor-hugo-flores-pereira-84831a274/">Victor Pereira</a></div>
    </div>
</body>
</html>
