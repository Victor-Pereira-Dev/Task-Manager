<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="/index/style.css">
</head>
<body>
    <div class="header">
        <div class="title">
            <h1>Task Manager</h1>
            <h3>Made by Victor Pereira</h3>
        </div>
    </div>
    <div class="content">
        <h2>Kanban Board</h2>
        <div class="kanban">

                <h1>BACKLOG</h1>

                <h1>DONE</h1>

        </div>
    </div>
    <div>3</div>
