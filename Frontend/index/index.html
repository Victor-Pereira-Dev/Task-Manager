<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="/index/style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <script type="module" src="/index/script.js" defer></script>
    <script type="module" src="../API/ApiFetch.js" defer></script>
</head>
<body>
    <div class="header">
        <div class="menu-btn">
            <button id="grid-btn">&#9776;</button>
        </div>
        <div id="meu-grid" class="grid-lateral">
            <div class="topo">
                <div class="menu-btn-fechar">
                    <button id="grid-btn-fechar">&#9776;</button>
                </div>
                <a href="#" class="item" id="projects">
                    <span class="material-icons-outlined">folder</span>
                    <span>Projetos</span>
                </a>
            </div>
            <a href="#" class="item" id="sair">
                <span class="material-icons-outlined">login</span>
                <span>Sair</span>
            </a>
        </div>
        <div class="title">
            <h1>Task Manager</h1>
            <h3>Made by Victor Pereira</h3>
        </div>
    </div>
    <div class="content">
        <div class="headerBoard">
            <h2 id="boardTitle">Kanban Board</h2>
            <button id="criarCard"><span>+ Novo Ticket</span></button>
        </div>
        <div class="kanban">
            <div class="backlog" data-coluna="backlog">
                <h1>BACKLOG</h1>
            </div>
            <div class="development" data-coluna="development">
                <h1>DEVELOPMENT</h1>
            </div>
            <div class="progress" data-coluna="progress">
                <h1>PROGRESS</h1>
            </div>
            <div class="done" data-coluna="done">
                <h1>DONE</h1>
            </div>
        </div>
    </div>
    <div id="overlay-carregando" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center;">
        <div class="spinner-grande"></div>
    </div>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Criar Ticket</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <form id="formTicket">
                <div class="modal-body">
                    <div class="field type-badge">
                        <label style="margin:0;">Tipo</label>
                        <select id="tipo">
                            <option value="tarefa">Tarefa</option>
                            <option value="bug">Bug</option>
                            <option value="historia">História</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="titulo">Título *</label>
                        <input type="text" id="titulo" placeholder="Ex: Ajustar layout do header" required>
                    </div>

                    <div class="field">
                        <label for="descricao">Descrição</label>
                        <textarea id="descricao" placeholder="Detalhe o que precisa ser feito..." required></textarea>
                    </div>

                    <div class="row">
                        <div class="field">
                            <label for="coluna">Coluna</label>
                            <select id="coluna">
                                <option value="backlog">Backlog</option>
                                <option value="development">Development</option>
                                <option value="progress">Progress</option>
                                <option value="done">Done</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="prioridade">Prioridade</label>
                            <select id="prioridade">
                                <option value="baixa">Baixa</option>
                                <option value="media" Selected>Média</option>
                                <option value="alta">Alta</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="btnCancelar">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Criar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlayEditar">
        <div class="modal">
            <div class="modal-header">
                <h3>Editar Ticket</h3>
                <button class="modal-close" id="modalCloseEditar">&times;</button>
            </div>
            <form id="formTicketEditar">
                <div class="modal-body">
                    <div class="field type-badge">
                        <label style="margin:0;">Tipo</label>
                        <select id="tipoEditar">
                            <option value="tarefa">Tarefa</option>
                            <option value="bug">Bug</option>
                            <option value="historia">História</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="titulo">Título *</label>
                        <input type="text" id="tituloEditar" placeholder="Ex: Ajustar layout do header" required>
                    </div>

                    <div class="field">
                        <label for="descricao">Descrição</label>
                        <textarea id="descricaoEditar" placeholder="Detalhe o que precisa ser feito..." required></textarea>
                    </div>

                    <div class="row">
                        <div class="field">
                            <label for="coluna">Coluna</label>
                            <select id="colunaEditar">
                                <option value="backlog">Backlog</option>
                                <option value="development">Development</option>
                                <option value="progress">Progress</option>
                                <option value="done">Done</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="prioridade">Prioridade</label>
                            <select id="prioridadeEditar">
                                <option value="baixa">Baixa</option>
                                <option value="media" Selected>Média</option>
                                <option value="alta">Alta</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="btnDeletarTicket">Deletar Projeto</button>
                    <button type="submit" class="btn btn-primary">Salvar Ticket</button>
                </div>
            </form>
        </div>
    </div>
    <div class="footer">
        <div>© <a href="https://www.linkedin.com/in/victor-hugo-flores-pereira-84831a274/">Victor Pereira</a></div>
    </div>
</body>
</html>
