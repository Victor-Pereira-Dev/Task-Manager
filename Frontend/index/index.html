<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="/index/style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <script src="/index/script.js" defer></script>
</head>
<body>
    <div class="header">
        <div class="menu-btn">
            <button id="grid-btn">&#9776;</button>
        </div>
        <div id="meu-grid" class="grid-lateral">
            <div class="menu-btn-fechar">
                <button id="grid-btn-fechar">&#9776;</button>
            </div>
            <a href="#" class="item">
                <span class="material-icons-outlined">check_box</span>
                <span>Quadros</span>
            </a>

            <a href="#" class="item">
                <span class="material-icons-outlined">folder</span>
                <span>Projetos</span>
            </a>

            <a href="#" class="item">
                <span class="material-icons-outlined">settings</span>
                <span>Configurações</span>
            </a>
        </div>
        <div class="title">
            <h1>Task Manager</h1>
            <h3>Made by Victor Pereira</h3>
        </div>
    </div>
    <div class="content">
        <h2>Kanban Board</h2>
        <div class="kanban">
            <div class="backlog">
                <h1>BACKLOG</h1>
            </div>
            <div class="development">
                <h1>DEVELOPMENT</h1>
            </div>
            <div class="progress">
                <h1>PROGRESS</h1>
            </div>
            <div class="done">
                <h1>DONE</h1>
            </div>
        </div>
    </div>
    <div>3</div>
</body>
</html>
