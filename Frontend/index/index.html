<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="/index/style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <script src="/index/script.js" defer></script>
</head>
<body>
    <div class="header">
        <div class="menu-btn">
            <button id="grid-btn">&#9776;</button>
        </div>
        <div id="meu-grid" class="grid-lateral">
            <div class="topo">
                <div class="menu-btn-fechar">
                    <button id="grid-btn-fechar">&#9776;</button>
                </div>
                <a href="#" class="item">
                    <span class="material-icons-outlined">check_box</span>
                    <span>Quadros</span>
                </a>
                <a href="#" class="item">
                    <span class="material-icons-outlined">folder</span>
                    <span>Projetos</span>
                </a>
            </div>
            <a href="#" class="item" id="sair">
                <span class="material-icons-outlined">login</span>
                <span>Sair</span>
            </a>
        </div>
        <div class="title">
            <h1>Task Manager</h1>
            <h3>Made by Victor Pereira</h3>
        </div>
    </div>
    <div class="content">
        <div class="headerBoard">
            <h2>Kanban Board</h2>
            <button id="criarCard"><span>+ Novo Ticket</span></button>
        </div>
        <div class="kanban">
            <div class="backlog">
                <h1>BACKLOG</h1>
            </div>
            <div class="development">
                <h1>DEVELOPMENT</h1>
            </div>
            <div class="progress">
                <h1>PROGRESS</h1>
            </div>
            <div class="done">
                <h1>DONE</h1>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Criar Ticket</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <form id="formTicket">
                <div class="modal-body">
                    <div class="field type-badge">
                        <label style="margin:0;">Tipo</label>
                        <select id="tipo">
                            <option value="task">Tarefa</option>
                            <option value="bug">Bug</option>
                            <option value="story">História</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="titulo">Título *</label>
                        <input type="text" id="titulo" placeholder="Ex: Ajustar layout do header" required>
                    </div>

                    <div class="field">
                        <label for="descricao">Descrição</label>
                        <textarea id="descricao" placeholder="Detalhe o que precisa ser feito..." required></textarea>
                    </div>

                    <div class="row">
                        <div class="field">
                            <label for="coluna">Coluna</label>
                            <select id="coluna">
                                <option value="backlog">Backlog</option>
                                <option value="development">Development</option>
                                <option value="progress">Progress</option>
                                <option value="done">Done</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="prioridade">Prioridade</label>
                            <select id="prioridade">
                                <option>Baixa</option>
                                <option selected>Média</option>
                                <option>Alta</option>
                            </select>
                        </div>
                    </div>

                    <div class="field">
                        <label for="responsavel">Responsável</label>
                        <input type="text" id="responsavel" placeholder="Nome do responsável" required>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="btnCancelar">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Criar</button>
                </div>
            </form>
        </div>
    </div>
    <div class="footer">
        <div>© <a href="https://www.linkedin.com/in/victor-hugo-flores-pereira-84831a274/">Victor Pereira</a></div>
    </div>
</body>
</html>
